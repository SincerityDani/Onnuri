<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM4 song list</title>
<meta name="description" content="WM4 찬양 콘티 보드 — A Key 4곡 송폼, 전환 안내 및 악보">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['-apple-system','BlinkMacSystemFont','Apple SD Gothic Neo','Pretendard','sans-serif']}}}};</script>
<style>
.flow-badge{display:inline-flex;align-items:center;padding:.25rem .65rem;border-radius:9999px;font-size:.8rem;font-weight:600}
html{scroll-behavior:smooth}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #818cf8;outline-offset:4px}img{height:auto}code{overflow-wrap:anywhere}
html:not(.dark) body{background:#f9fafb;color:#18181b}html:not(.dark) header{background:rgba(255,255,255,.92)}html:not(.dark) .card-surface{background:#fff;border-color:#d4d4d8}
html:not(.dark) [class*="bg-zinc-950"],html:not(.dark) [class*="bg-zinc-800"],html:not(.dark) p.bg-zinc-900{background:#f4f4f5}html:not(.dark) [class*="border-zinc-"]{border-color:#d4d4d8}
html:not(.dark) [class*="text-zinc-200"],html:not(.dark) [class*="text-zinc-300"]{color:#3f3f46}html:not(.dark) [class*="text-zinc-400"],html:not(.dark) [class*="text-zinc-600"]{color:#52525b}
html:not(.dark) [class*="text-indigo-"],html:not(.dark) [class*="text-purple-"]{color:#4f46e5}html:not(.dark) [class*="text-emerald-"]{color:#047857}html:not(.dark) [class*="text-rose-"]{color:#be123c}html:not(.dark) [class*="text-amber-"]{color:#92400e}
html:not(.dark) [class*="bg-emerald-950"]{background:#ecfdf5}html:not(.dark) [class*="bg-rose-950"]{background:#fff1f2}html:not(.dark) [class*="bg-amber-950"]{background:#fffbeb}
@media(max-width:640px){header{position:relative!important}.page-padding{padding-left:1rem;padding-right:1rem}.card-surface{padding:1rem}}
@media print{@page{margin:12mm}body{background:#fff!important;color:#000!important}.no-print{display:none!important}.print-break{page-break-inside:avoid;break-inside:avoid}.card-surface{background:#fff!important;border:1px solid #d1d5db!important;box-shadow:none!important}.card-surface p,.card-surface li,.card-surface h2,.card-surface h3,.card-surface span,.card-surface div{color:#111!important}.text-muted{color:#4b5563!important}#SheetModal{display:block!important}#sheetGrid{display:block}#sheetGrid>div{margin-top:1rem}#sheetGrid img{max-height:230mm;object-fit:contain}}
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen transition-colors duration-200 selection:bg-indigo-500 selection:text-white">
<header class="sticky top-0 z-50 backdrop-blur-md bg-zinc-900/80 border-b border-zinc-800 px-6 py-4 no-print page-padding">
<div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
<div class="flex items-center gap-3"><span class="px-3 py-1 rounded-lg bg-indigo-600 text-white font-bold text-sm tracking-wide">A KEY</span><h1 class="text-xl font-bold tracking-tight">WM4 song list</h1></div>
<div class="flex flex-wrap items-center gap-2 text-sm">
<button id="sheetToggle" aria-controls="SheetModal" aria-expanded="true" class="px-3.5 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium transition">악보 뷰어 닫기</button>
<button onclick="toggleTheme()" class="px-3.5 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium transition" id="themeBtn">라이트 모드</button>
<button onclick="window.print()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition">인쇄 / PDF 저장</button>
</div></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 space-y-6 page-padding">
<section class="card-surface bg-zinc-900/90 border border-zinc-800 rounded-2xl p-5 shadow-lg print-break">
<div class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-3">Overall Setlist Flow</div>
<div class="flex flex-wrap items-center gap-2 text-sm md:text-base font-semibold">
<span class="px-3 py-1.5 rounded-xl bg-zinc-800 border border-zinc-700">1. 복음 들고 산을 넘는 자들</span>
<span class="text-emerald-400 font-bold text-xs px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30">⚡ 바로 직결</span>
<span class="px-3 py-1.5 rounded-xl bg-zinc-800 border border-zinc-700">2. 갈릴리 마을 그 숲속에서</span>
<span class="text-rose-400 font-bold text-xs px-2 py-0.5 rounded bg-rose-500/10 border border-rose-500/30">🛑 완전 종료 후 멘트</span>
<span class="px-3 py-1.5 rounded-xl bg-zinc-800 border border-zinc-700">3. 오늘 이곳에 계신 성령님</span>
<span class="text-amber-400 font-bold text-xs px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30">🎵 A코드 유지 (텀) → 후렴 진입</span>
<span class="px-3 py-1.5 rounded-xl bg-zinc-800 border border-zinc-700">4. 주님 큰 영광 받으소서 (후렴 x3)</span>
</div></section>
<div id="songCards" class="space-y-6"></div>
<section id="SheetModal" class="space-y-6 pt-4 border-t border-zinc-800">
<div class="flex flex-wrap items-center justify-between gap-4 no-print bg-zinc-900 p-4 rounded-xl border border-zinc-800 card-surface">
<div><h3 class="font-bold text-base">악보 뷰어</h3><p class="text-xs text-zinc-400 mt-1">기본 악보 4장이 연결되어 있어. 이미지를 누르면 원본으로 볼 수 있어.</p><p class="text-xs text-zinc-400 mt-1">다른 악보를 순서대로 선택하면 이 화면에서만 바뀌어. 새로 열면 기본 악보로 돌아와.</p></div>
<label class="text-xs text-zinc-300">악보 바꾸기<input type="file" id="sheetInput" multiple accept="image/*" class="block mt-2 text-xs text-zinc-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"></label>
</div><div id="sheetGrid" class="grid md:grid-cols-2 gap-6 items-start"></div></section>
<noscript><p>콘티와 악보를 보려면 브라우저의 JavaScript를 켜줘.</p></noscript>
</main>
<script>
const songs=[
{title:'복음 들고 산을 넘는 자들',subtitle:'Our God Reigns',file:'assets/01-our-god-reigns.jpeg',steps:[['전주 (Intro)','zinc'],['1회차 완창 (처음~끝)','indigo'],['간주 4마디 (쉬어가기)','amber'],['2회차 완창 (처음~끝)','indigo']],checks:[
'<strong>1회차 완창:</strong> "복음 들고 산을 넘는 자들의 발길 ~ 주 다스리시네"까지 전체 1회',
'<strong>중간 4마디 간주:</strong> 1회차 엔딩 직후 4마디 간주 진행 (마지막 줄 <code>D - E/D | A/C# - F#m | D - E | A</code> 패턴 추천)',
'<strong>2회차 진입:</strong> 간주 4번째 마디 마지막 박에 못갖춘마디 <em>"복음 들고"</em>로 진입하여 끝까지 완창'],transition:'⚡ Next Transition (1번 → 2번 연결)',color:'emerald',detail:'2회차 마지막 마디 <strong>"주 다스리시네" (A 코드)</strong>에서 끝나지 않고, 그 마디의 <strong>4박자째</strong>에 바로 2번 곡 첫 가사 <strong>"갈~릴리 마을"</strong>로 쉬지 않고 이어 부릅니다.',note:'[완창 1회] → [4마디 간주] → [완창 2회] → 마지막 마디에서 2번 곡으로 바로 직결!'},
{title:'갈릴리 마을 그 숲속에서',file:'assets/02-galilee.jpeg',steps:[['전주 없이 바로 1절','emerald'],['1절 완창 (후렴 포함)','indigo'],['2절 완창 (후렴 포함)','indigo'],['후렴 1회 반복','purple'],['Tag: 마지막 줄 2번 더!','rose']],checks:[
'<strong>1절 & 2절:</strong> 1절 끝까지 부른 후 바로 2절 <em>"지금도 우리 주 찾아오사~"</em>부터 끝까지 진행',
'<strong>후렴 반복:</strong> 2절 끝난 후 5번째 줄 <strong>"가서 제자 삼으라 세상 많은 사람들을~"</strong>부터 끝까지 1회 반복',
'<strong>엔딩 Tag (x2):</strong> 마지막 소절 <strong>"내가 너희와 항상 함께 하리라"</strong>만 <strong>2번 더</strong> 반복하여 총 3번 고백 후 엔딩'],transition:'🛑 Next Transition (2번 → 3번 연결)',color:'rose',detail:'마지막 "항상 함께 하리라" 후 <strong>곡을 완전히 끝맺습니다 (Full Stop).</strong><br>이후 <strong>인도자 멘트</strong>가 진행되며, 멘트 마무리 사인에 맞춰 3번 곡 전주로 들어갑니다.',note:'[1절] → [2절] → [후렴 반복] → [\'내가 너희와~\' 2번 더] → 완전히 끝내고 멘트'},
{title:'오늘 이곳에 계신 성령님',file:'assets/03-holy-spirit.jpeg',steps:[['멘트 후 전주','zinc'],['1회차: 절 + 후렴 (브릿지 X)','indigo'],['간주 4마디','amber'],['2회차: 처음 ~ 후렴 ~ 브릿지까지','indigo'],['후렴으로 돌아와 마무리','purple']],checks:[
'<strong>1회차 (브릿지 생략):</strong> "오늘 이곳에~"부터 18마디 "사랑으로 인도하소서"까지만 완창',
'<strong>중간 4마디 간주:</strong> 브릿지로 가지 않고 4마디 간주 연주 후 다시 처음으로 이동',
'<strong>2회차 (브릿지 포함):</strong> 처음부터 후렴을 거쳐 브릿지(<em>"창조하신 모습 떠난 우리를~ 예수님 닮게 빚으소서"</em>)까지 직진',
'<strong>최종 후렴:</strong> 브릿지 직후 후렴(<em>"주님보다 앞서지 않고~"</em>)으로 돌아와 <em>"사랑으로 인도하소서"</em>로 마무리'],transition:'🎵 Next Transition (3번 → 4번 연결)',color:'amber',detail:'마지막 "인도하소서" 끝 코드인 <strong>A 코드를 계속 잔잔하게 치면서 잠시 텀(호흡)</strong>을 줍니다.<br>인도자 호흡에 맞춰 4박자 마지막에 <strong>"모-든"</strong>으로 치고 들어가며 <strong>4번 곡 후렴으로 바로 진입</strong>합니다.',note:'[1회차 브릿지X] → [4마디 간주] → [2회차 브릿지까지] → [후렴 마무리] → A코드 유지'},
{title:'주님 큰 영광 받으소서',subtitle:'(후렴만 3회)',file:'assets/04-highest-honour.jpeg',steps:[['"모-든" 픽업 진입','amber'],['후렴 1회 ("영광과 존귀와 능력~")','indigo'],['후렴 2회 반복','indigo'],['후렴 3회 반복 후 최종 엔딩','rose']],checks:[
'<strong>앞부분(절) 생략:</strong> "주님 큰 영광 받으소서 ~ 주님께 찬양 드리리" 구간은 부르지 않음',
'<strong>후렴구 3회 연속 반복:</strong> 5번째 단 <strong>"모-든 영광과 존귀와 능력 받으소서 받으소서 그리스도 살아계신 하나님"</strong> 구간만 3번 연속 반복'],transition:'🎹 후렴 코드 진행 (3회 반복 구간)',color:'zinc',detail:'<span class="font-mono text-xs md:text-sm">| A  E/G# | F#m  A/E | D  A/C# | Bm7  E7 |<br>| C#  F#m7 | Bm  D/E | A  (E7) |</span>',note:'앞부분 생략! 5번째 줄 [\'모-든 영광과 존귀와 능력~\'] 후렴만 3번 반복'}
];
const badgeClasses={zinc:'bg-zinc-800 text-zinc-300',indigo:'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30',amber:'bg-amber-500/20 text-amber-300 border border-amber-500/30',purple:'bg-purple-500/20 text-purple-300 border border-purple-500/30',rose:'bg-rose-500/20 text-rose-300 border border-rose-500/30',emerald:'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'};
const transitionClasses={emerald:['bg-emerald-950/30 border-emerald-800/50','text-emerald-400'],rose:['bg-rose-950/30 border-rose-800/50','text-rose-400'],amber:['bg-amber-950/30 border-amber-800/50','text-amber-400'],zinc:['bg-zinc-950/60 border-zinc-800/80','text-indigo-400']};
document.getElementById('songCards').innerHTML=songs.map((s,i)=>`<article class="card-surface bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-lg print-break"><div class="flex flex-wrap items-start justify-between gap-4 border-b border-zinc-800 pb-4 mb-4"><div class="flex items-start gap-2.5"><span class="w-7 h-7 shrink-0 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-sm">${i+1}</span><h2 class="text-xl font-bold">${s.title} ${s.subtitle?`<span class="text-sm font-normal ${i===3?'text-amber-400':'text-zinc-400'} ml-1">${s.subtitle}</span>`:''}</h2></div><div class="flex items-center gap-2"><span class="px-2.5 py-1 rounded-md bg-zinc-800 text-zinc-300 text-xs font-semibold">Key: A</span><span class="px-2.5 py-1 rounded-md bg-zinc-800 text-zinc-300 text-xs font-semibold">4/4박자</span></div></div><div class="mb-5"><div class="text-xs font-semibold text-zinc-400 mb-2">송폼 진행 순서 (Song Form${i===3?' - 앞부분 생략':''})</div><div class="flex flex-wrap items-center gap-2">${s.steps.map(([label,color])=>`<span class="flow-badge ${badgeClasses[color]}">${label}</span>`).join('<span class="text-zinc-600">→</span>')}</div></div><div class="grid md:grid-cols-2 gap-4 text-sm"><div class="bg-zinc-950/60 border border-zinc-800/80 rounded-xl p-4"><div class="font-semibold text-indigo-400 mb-1.5">📌 구간별 체크포인트</div><ul class="space-y-1.5 text-zinc-300 text-muted list-disc list-inside">${s.checks.map(c=>`<li>${c}</li>`).join('')}</ul></div><div class="${transitionClasses[s.color][0]} border rounded-xl p-4 flex flex-col justify-center"><div class="font-semibold ${transitionClasses[s.color][1]} mb-1">${s.transition}</div><p class="text-zinc-200 text-muted leading-relaxed">${s.detail}</p></div></div></article>`).join('');
function renderSheets(sources){const grid=document.getElementById('sheetGrid');grid.replaceChildren();sources.forEach((src,i)=>{const card=document.createElement('div');card.className='card-surface bg-zinc-900 border border-zinc-800 rounded-2xl p-4 print-break';const note=document.createElement('div');note.className='text-sm font-bold text-indigo-400 mb-2';note.textContent=`${i+1}. ${songs[i].title} : ${songs[i].note}`;const link=document.createElement('a');link.href=src;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label',songs[i].title+' 악보 원본 보기');const img=document.createElement('img');img.src=src;img.className='w-full rounded-lg border border-zinc-700 bg-white';img.alt=songs[i].title+' 악보';link.append(img);card.append(note,link);grid.append(card);});}
renderSheets(songs.map(s=>s.file));
function applyTheme(light){document.documentElement.classList.toggle('dark',!light);document.getElementById('themeBtn').textContent=light?'다크 모드':'라이트 모드';}
function toggleTheme(){const light=document.documentElement.classList.contains('dark');applyTheme(light);try{localStorage.setItem('wm4-theme',light?'light':'dark');}catch(e){}}
try{applyTheme(localStorage.getItem('wm4-theme')==='light');}catch(e){}
document.getElementById('sheetToggle').addEventListener('click',function(){const hidden=document.getElementById('SheetModal').classList.toggle('hidden');this.setAttribute('aria-expanded',String(!hidden));this.textContent=hidden?'악보 뷰어 열기':'악보 뷰어 닫기';});
let customUrls=[];
document.getElementById('sheetInput').addEventListener('change',function(e){const files=Array.from(e.target.files).slice(0,4);if(!files.length)return;customUrls.forEach(u=>URL.revokeObjectURL(u));customUrls=files.map(f=>URL.createObjectURL(f));renderSheets(customUrls);});
</script>
</body>
</html>
